<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        :root {
            --bg-color: #f4f4f4;
            --text-color: #333;
            --primary-color: #4CAF50;
            --secondary-color: #45a049;
            --card-bg: #fff;
            --card-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #f4f4f4;
            --card-bg: #333;
            --card-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        #app {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        button {
            padding: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        #taskList {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }

        #taskList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--card-bg);
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        #taskList li button {
            background-color: #ff4d4d;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        #taskList li button:hover {
            background-color: #cc0000;
        }

        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--card-shadow);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle">🌓</button>

        <!-- Login/Signup Section -->
        <div id="auth-section">
            <h1>Welcome to Task Manager</h1>
            <div id="login-form">
                <h2>Login</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <p>Don't have an account? <a href="#" id="showSignup">Sign Up</a></p>
            </div>
            <div id="signup-form" class="hidden">
                <h2>Sign Up</h2>
                <form id="signupForm">
                    <input type="text" id="signupName" placeholder="Name" required>
                    <input type="email" id="signupEmail" placeholder="Email" required>
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>
                <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden">
            <h1>Dashboard</h1>
            <button id="logoutBtn">Logout</button>
            <h2>Your Tasks</h2>
            <ul id="taskList"></ul>
            <form id="addTaskForm">
                <input type="text" id="taskInput" placeholder="Add a new task" required>
                <button type="submit">Add Task</button>
            </form>
        </div>
    </div>

    <script>
        // Simulated User Data
        let users = [];
        let currentUser = null;

        // DOM Elements
        const authSection = document.getElementById('auth-section');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const showSignup = document.getElementById('showSignup');
        const showLogin = document.getElementById('showLogin');
        const dashboardSection = document.getElementById('dashboard-section');
        const logoutBtn = document.getElementById('logoutBtn');
        const taskList = document.getElementById('taskList');
        const addTaskForm = document.getElementById('addTaskForm');
        const taskInput = document.getElementById('taskInput');
        const themeToggle = document.getElementById('theme-toggle');

        // Event Listeners
        loginForm.addEventListener('submit', handleLogin);
        signupForm.addEventListener('submit', handleSignup);
        showSignup.addEventListener('click', () => toggleAuthForms('signup'));
        showLogin.addEventListener('click', () => toggleAuthForms('login'));
        logoutBtn.addEventListener('click', handleLogout);
        addTaskForm.addEventListener('submit', handleAddTask);
        themeToggle.addEventListener('click', toggleTheme);

        // Functions
        function toggleAuthForms(formType) {
            document.getElementById('login-form').classList.toggle('hidden', formType === 'signup');
            document.getElementById('signup-form').classList.toggle('hidden', formType === 'login');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                currentUser = user;
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                renderTasks();
            } else {
                alert('Invalid email or password');
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            const userExists = users.some(u => u.email === email);
            if (userExists) {
                alert('User already exists');
            } else {
                const newUser = { name, email, password, tasks: [] };
                users.push(newUser);
                alert('Signup successful! Please login.');
                toggleAuthForms('login');
            }
        }

        function handleLogout() {
            currentUser = null;
            dashboardSection.classList.add('hidden');
            authSection.classList.remove('hidden');
        }

        function handleAddTask(e) {
            e.preventDefault();
            const taskText = taskInput.value.trim();
            if (taskText) {
                currentUser.tasks.push(taskText);
                renderTasks();
                taskInput.value = '';
            }
        }

        function renderTasks() {
            taskList.innerHTML = '';
            currentUser.tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.textContent = task;
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', () => deleteTask(index));
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });
        }

        function deleteTask(index) {
            currentUser.tasks.splice(index, 1);
            renderTasks();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
        }
    </script>
</body>
</html>
